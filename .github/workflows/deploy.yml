name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Scaleway Container Registry (Amsterdam, privat)
  SCW_REGISTRY: rg.nl-ams.scw.cloud
  SCW_IMAGE_NAME: levo-studio/reps-website
  SCW_REGION: nl-ams

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_IMAGE_NAME }}
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dokploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image digest
        run: |
          IMAGE="${SCW_REGISTRY}/${SCW_IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$IMAGE" >/dev/null
          echo "pushed image digest is available: $IMAGE"

      # Scaleway: Container auf das neue Image umstellen. Läuft erst, wenn die
      # Repository-Variable SCW_CONTAINER_ID gesetzt ist (nach Anlegen des Containers).
      - name: Deploy to Scaleway Serverless Containers
        if: ${{ vars.SCW_CONTAINER_ID != '' }}
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
          NEW_IMAGE: ${{ env.SCW_REGISTRY }}/${{ env.SCW_IMAGE_NAME }}:build-${{ github.run_number }}
        run: |
          set -euo pipefail
          API="https://api.scaleway.com/containers/v1/regions/${SCW_REGION}/containers/${SCW_CONTAINER_ID}"

          echo "Updating container to ${NEW_IMAGE} ..."
          curl --fail-with-body --silent --show-error -X PATCH "$API" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" -H "Content-Type: application/json" \
            -d "{\"image\": \"${NEW_IMAGE}\"}" >/dev/null

          sleep 10
          for i in $(seq 1 60); do
            BODY="$(curl --fail --silent --show-error "$API" -H "X-Auth-Token: ${SCW_SECRET_KEY}")"
            STATUS="$(echo "$BODY" | jq -r '.status')"
            IMAGE="$(echo "$BODY" | jq -r '.image')"
            echo "status: ${STATUS}"
            if [ "$STATUS" = "ready" ] && [ "$IMAGE" = "$NEW_IMAGE" ]; then
              echo "Deployment completed: ${IMAGE}"; exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "Deployment failed – see Scaleway console logs."; exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deployment."; exit 1
