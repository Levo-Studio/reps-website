name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The Playwright web server runs `pnpm e2e:serve`, which performs the
      # production build and serves the standalone output, so this step is
      # also the build check; a separate `pnpm build` would only repeat it.
      - name: Build and run end-to-end tests
        run: pnpm test:e2e
        env:
          CI: "1"

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build Docker image
        run: docker build -f Dockerfile.dokploy -t reps-website:ci .
